<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Members’ Gallery — American Basilicas</title>
<meta name="description" content="Photos, reviews, questions and answers about the U.S. minor basilicas from American Basilicas members, basilica by basilica on the map.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="members/members.css">
<link rel="stylesheet" href="members/blocks.css">
<link rel="stylesheet" href="texture/texture.css">
<script src="members/vendor/supabase-2.117.3.js"></script>
<script src="members/config.js"></script>
<script src="members/core.js"></script>
<script src="members/shell.js"></script>
<script src="members/visit.js"></script>
<script src="members/bview.js"></script>
<script src="members/gallery-map.js"></script>
</head>
<body class="mp">
<main id="main" aria-live="polite"></main>
<footer class="mf">Photos, reviews, questions and answers are shared by members and checked before they appear here. They’re visible only to signed-in members with gallery access; please don’t copy them elsewhere without the member’s permission. · <a href="privacy.html">Privacy policy</a></footer>
<script>
(function () {
  "use strict";
  const E = AB.esc, main = document.getElementById("main"), G = window.AB_GMAP;
  AB.shell({ active: "gallery", title: 'Members’ <span class="thin">Gallery</span>' });
  if (!AB.enabled) return AB.notConfigured(main);
  AB.onAuth((u) => (u ? start() : signin()));

  function signin() {
    main.innerHTML = '<section class="panel"><div class="panel-bar"><h2>Members only</h2><span class="tag">Sign in to see the gallery</span></div><div class="panel-body" id="form"></div></section>';
    AB.signinForm(document.getElementById("form"), { lead: "The members’ gallery holds photos, reviews, and questions and answers from members, basilica by basilica on the map." });
  }

  const svgNS = "http://www.w3.org/2000/svg";
  let M = null, BY = {}, COUNTS = {}, VISITS = new Map(), LIST = [];
  let selState = null, selB = null, tab = "photos", sort = "popular";

  async function start() {
    main.innerHTML =
      '<div class="gnote" id="gnote"><span class="spin"></span> Loading…</div>' +
      '<div class="gwrap">' +
      '<section class="panel gmapcol" aria-labelledby="gmH"><div class="panel-bar"><h2 id="gmH">Gallery map</h2><span class="tag">Tap a state, then a basilica</span></div>' +
      '<div class="gmapbox"><svg id="gmap" viewBox="0 0 ' + G.w + " " + G.h + '" role="img" aria-label="Map of the basilicas with members’ photos, reviews and questions"></svg>' +
      '<button class="btn small greset" type="button" id="greset" hidden>&larr; Whole country</button>' +
      '<div class="gzoom" role="group" aria-label="Zoom the map"><button type="button" id="gzin" aria-label="Zoom in">+</button><button type="button" id="gzout" aria-label="Zoom out">&minus;</button></div></div>' +
      '<div class="glegend"><span class="gkey"><svg viewBox="0 0 100 100" width="12" height="15" aria-hidden="true"><use href="#omb" width="100" height="100"/></svg> Has photos, reviews or questions</span>' +
      '<span class="gkey none"><svg viewBox="0 0 100 100" width="12" height="15" aria-hidden="true"><use href="#omb" width="100" height="100"/></svg> Nothing shared yet</span>' +
      '<span class="gtot" id="gtot"></span></div>' +
      '<div class="gpick"><label class="fld" for="gpick">Or choose a basilica</label><select id="gpick"><option value="">Choose…</option></select></div></section>' +
      '<section class="panel gside" id="gside" aria-labelledby="gsH"><div class="panel-bar"><h2 id="gsH">Choose a basilica</h2><span class="tag" id="gsT"></span></div><div class="panel-body" id="gsB"></div></section>' +
      "</div>";
    try {
      const [m, bs, counts, vs] = await Promise.all([AB.membership(), AB.basilicas(), AB.allCounts(), AB.visits()]);
      M = m; COUNTS = counts; VISITS = vs; LIST = bs; bs.forEach((b) => (BY[b.id] = b));
    } catch (e) { document.getElementById("gnote").innerHTML = '<p class="msg err">Couldn’t open the gallery: ' + E(e.message) + "</p>"; return; }
    note(); drawMap(); fillPick();
    window.addEventListener("hashchange", fromHash);
    fromHash();
  }

  const cnt = (id) => COUNTS[id] || { photos: 0, reviews: 0, questions: 0 };
  const plural = (n, w) => n.toLocaleString() + " " + w + (n === 1 ? "" : "s");
  const countLine = AB.countLine, total = (id) => AB.countTotal(cnt(id));

  // ---------- membership note ----------
  function note() {
    const el = document.getElementById("gnote"), line = AB.memberLine(M);
    el.className = "gnote " + M.kind;
    el.innerHTML = '<span class="chip">' + E(line.tag) + "</span><span>" + line.html + "</span>" +
      (M.kind === "trial" ? '<a class="btn small" href="' + E(AB.SUBSCRIBE_URL) + '" target="_blank" rel="noopener">Subscribe</a>' : "") +
      (M.kind === "expired" ? '<span class="btnrow">' + AB.subscribeButtons(M) + "</span>" + AB.subscribeNote(M) : "");
    AB.wireRecheck(el, (m) => { M = m; note(); if (selB) openBasilica(selB, false); });
  }

  // ---------- the map ----------
  let zoomG, mks = [], view = { k: 1, x: 0, y: 0 }, anim = 0;
  function drawMap() {
    const svg = document.getElementById("gmap");
    const el = (n, a) => { const e = document.createElementNS(svgNS, n); for (const k in a) e.setAttribute(k, a[k]); return e; };
    zoomG = el("g", { class: "gz" }); svg.appendChild(zoomG);
    const counts = {};
    G.markers.forEach((m) => { const c = cnt(m.id); (counts[m.s] = counts[m.s] || { b: 0, items: 0 }); counts[m.s].b++; counts[m.s].items += AB.countTotal(c); });
    G.states.forEach((s) => {
      const c = counts[s.n];
      const p = el("path", { d: s.d, class: "gst" + (c ? " has" : ""), "data-n": s.n });
      const t = el("title", {}); t.textContent = s.n + (c ? " — " + plural(c.b, "basilica") : ""); p.appendChild(t);
      if (c) p.addEventListener("click", () => openState(s.n, true));
      zoomG.appendChild(p);
    });
    // shaded relief printed over the tints (same projection as the main map; tools/build_relief.py)
    zoomG.appendChild(el("image", { href: "texture/relief.webp", x: 0, y: 0, width: G.w, height: G.h, preserveAspectRatio: "none", class: "relief" }));
    zoomG.appendChild(el("path", { d: G.lakes, class: "glake" }));
    const mg = el("g", { class: "gmk" }); zoomG.appendChild(mg);
    const ordered = G.markers.slice().sort((a, b) => (total(a.id) > 0) - (total(b.id) > 0));
    ordered.forEach((m) => {
      const b = BY[m.id]; if (!b) return;
      const c = cnt(m.id), has = AB.countTotal(c) > 0;
      const g = el("g", { class: "gm" + (has ? "" : " none"), "data-id": m.id, tabindex: "0", role: "button", "aria-label": b.name + ", " + b.city + ": " + countLine(c) });
      const t = el("title", {}); t.textContent = b.name + " — " + b.city + "\n" + countLine(c); g.appendChild(t);
      g.appendChild(el("circle", { r: 8, class: "hit" }));
      g.appendChild(el("use", { href: "#omb-pin", x: -5.33, y: -8, width: 10.67, height: 16 }));
      const go = () => { selState = m.s; openBasilica(m.id, true); };
      g.addEventListener("click", (e) => { e.stopPropagation(); go(); });
      g.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
      mg.appendChild(g); mks.push({ g, m });
    });
    const tot = Object.values(COUNTS).reduce((a, c) => ({ photos: a.photos + c.photos, reviews: a.reviews + c.reviews, questions: a.questions + (c.questions || 0) }), { photos: 0, reviews: 0, questions: 0 });
    document.getElementById("gtot").textContent = countLine(tot) + " shared so far";
    document.getElementById("greset").onclick = () => { selState = null; selB = null; setHash(""); zoomTo(null); intro(); };
    document.getElementById("gzin").onclick = () => zoomBy(1.8);
    document.getElementById("gzout").onclick = () => zoomBy(1 / 1.8);
    gestures(svg);
    window.addEventListener("resize", place);
    place();
  }

  // ---------- zooming the map on its own ----------
  // Pinching or ctrl/trackpad-zooming over the map zooms only the map, never the page, so the basilica panel
  // below stays at normal size. One finger still scrolls the page; two fingers pinch and move the map.
  const ZMAX = 14;
  let lastGesture = 0;
  function clampView(v) {
    const k = Math.max(1, Math.min(ZMAX, v.k));
    return { k, x: Math.min(0, Math.max(G.w * (1 - k), v.x)), y: Math.min(0, Math.max(G.h * (1 - k), v.y)) };
  }
  function toSvg(svg, cx, cy) {                // screen point -> map units (the SVG keeps its aspect ratio, centred)
    const r = svg.getBoundingClientRect(), s = Math.min(r.width / G.w, r.height / G.h) || 1;
    return { x: (cx - r.left - (r.width - G.w * s) / 2) / s, y: (cy - r.top - (r.height - G.h * s) / 2) / s };
  }
  function zoomAround(pt, k, from) {           // keep the map point under pt where it is
    const v = from || view, mx = (pt.x - v.x) / v.k, my = (pt.y - v.y) / v.k;
    return clampView({ k, x: pt.x - mx * k, y: pt.y - my * k });
  }
  function zoomBy(f) { animate(zoomAround({ x: G.w / 2, y: G.h / 2 }, view.k * f)); }
  function gestures(svg) {
    let pinch = null, drag = null;
    const two = (t) => ({ cx: (t[0].clientX + t[1].clientX) / 2, cy: (t[0].clientY + t[1].clientY) / 2, d: Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY) || 1 });
    svg.addEventListener("touchstart", (e) => {
      if (e.touches.length !== 2) return;
      e.preventDefault(); cancelAnimationFrame(anim);
      const g = two(e.touches); pinch = { g, v: Object.assign({}, view), m: toSvg(svg, g.cx, g.cy) };
    }, { passive: false });
    svg.addEventListener("touchmove", (e) => {
      if (!pinch || e.touches.length !== 2) return;
      e.preventDefault();
      const g = two(e.touches), k = pinch.v.k * g.d / pinch.g.d, at = toSvg(svg, g.cx, g.cy);
      const mx = (pinch.m.x - pinch.v.x) / pinch.v.k, my = (pinch.m.y - pinch.v.y) / pinch.v.k;   // map point under the fingers at the start
      view = clampView({ k, x: at.x - mx * Math.max(1, Math.min(ZMAX, k)), y: at.y - my * Math.max(1, Math.min(ZMAX, k)) });
      place();
    }, { passive: false });
    const endPinch = (e) => { if (pinch && e.touches.length < 2) { pinch = null; lastGesture = Date.now(); } };
    svg.addEventListener("touchend", endPinch); svg.addEventListener("touchcancel", endPinch);
    // Safari's own pinch events: block page zoom on iPhone; zoom the map with them on a Mac trackpad
    let gs = null;
    svg.addEventListener("gesturestart", (e) => { e.preventDefault(); if (!("ontouchstart" in window)) gs = { v: Object.assign({}, view), pt: toSvg(svg, e.clientX, e.clientY) }; }, { passive: false });
    svg.addEventListener("gesturechange", (e) => { e.preventDefault(); if (gs) { cancelAnimationFrame(anim); view = zoomAround(gs.pt, gs.v.k * e.scale, gs.v); place(); } }, { passive: false });
    svg.addEventListener("gestureend", (e) => { e.preventDefault(); if (gs) { gs = null; lastGesture = Date.now(); } }, { passive: false });
    // trackpad pinch / ctrl + scroll wheel on a computer
    svg.addEventListener("wheel", (e) => {
      if (!e.ctrlKey) return;
      e.preventDefault(); cancelAnimationFrame(anim);
      view = zoomAround(toSvg(svg, e.clientX, e.clientY), view.k * Math.exp(-e.deltaY * (e.deltaMode ? 0.05 : 0.005))); place();
    }, { passive: false });
    // drag with the mouse to move a zoomed-in map
    svg.addEventListener("pointerdown", (e) => {
      if (e.pointerType !== "mouse" || e.button !== 0 || view.k <= 1.01) return;
      drag = { x: e.clientX, y: e.clientY, v: Object.assign({}, view), moved: false };
    });
    window.addEventListener("pointermove", (e) => {
      if (!drag) return;
      const a = toSvg(svg, drag.x, drag.y), b = toSvg(svg, e.clientX, e.clientY);
      if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 4) return;
      drag.moved = true; svg.classList.add("dragging"); cancelAnimationFrame(anim);
      view = clampView({ k: drag.v.k, x: drag.v.x + b.x - a.x, y: drag.v.y + b.y - a.y }); place();
    });
    window.addEventListener("pointerup", () => { if (drag && drag.moved) lastGesture = Date.now(); drag = null; svg.classList.remove("dragging"); });
    // a pinch or drag isn't a tap: don't let it open a state or basilica
    svg.addEventListener("click", (e) => { if (Date.now() - lastGesture < 400) { e.stopPropagation(); e.preventDefault(); } }, true);
  }
  function place() {                         // keep markers about 14 px tall on screen at any zoom
    const svg = document.getElementById("gmap"); if (!svg) return;
    const s = (svg.getBoundingClientRect().width || G.w) / G.w, px = s < 0.6 ? 15 : 14, q = px / 16 / s / view.k;
    zoomG.setAttribute("transform", "translate(" + view.x.toFixed(2) + " " + view.y.toFixed(2) + ") scale(" + view.k.toFixed(4) + ")");
    document.getElementById("greset").hidden = !selState && view.k <= 1.02;
    document.getElementById("gzout").disabled = view.k <= 1.01;
    document.getElementById("gzin").disabled = view.k >= ZMAX - 0.01;
    const rl = zoomG.querySelector(".relief"), rz = (Math.round(Math.min(1, 2.6 / view.k) * 10) / 10).toFixed(1);
    if (rl && rl.dataset.rz !== rz) { rl.dataset.rz = rz; rl.style.setProperty("--rz", rz); }
    mks.forEach(({ g, m }) => g.setAttribute("transform", "translate(" + m.x + " " + m.y + ") scale(" + q.toFixed(4) + ")"));
  }
  function zoomTo(stateName) {
    let to = { k: 1, x: 0, y: 0 };
    document.querySelectorAll("#gmap .gst").forEach((p) => p.classList.toggle("on", p.dataset.n === stateName));
    document.getElementById("gmap").classList.toggle("zoomed", !!stateName);
    if (stateName) {
      const p = document.querySelector('#gmap .gst[data-n="' + CSS.escape(stateName) + '"]'), bb = p.getBBox();
      const k = Math.max(1, Math.min(9, 0.82 * Math.min(G.w / Math.max(bb.width, 1), G.h / Math.max(bb.height, 1))));
      to = { k, x: G.w / 2 - k * (bb.x + bb.width / 2), y: G.h / 2 - k * (bb.y + bb.height / 2) };
    }
    animate(clampView(to));
  }
  function animate(to) {
    const from = Object.assign({}, view), t0 = performance.now(), dur = matchMedia("(prefers-reduced-motion:reduce)").matches ? 0 : 450;
    cancelAnimationFrame(anim);
    const step = (t) => {
      const f = dur ? Math.min(1, (t - t0) / dur) : 1, e = f < 0.5 ? 2 * f * f : 1 - Math.pow(-2 * f + 2, 2) / 2;
      const lk = Math.log(from.k) + (Math.log(to.k) - Math.log(from.k)) * e;
      view = { k: Math.exp(lk), x: from.x + (to.x - from.x) * e, y: from.y + (to.y - from.y) * e };
      place(); if (f < 1) anim = requestAnimationFrame(step);
    };
    anim = requestAnimationFrame(step);
  }
  function markSel() { mks.forEach(({ g, m }) => g.classList.toggle("sel", m.id === selB)); }

  function fillPick() {
    const pick = document.getElementById("gpick"), groups = {};
    LIST.forEach((b) => (groups[b.state] = groups[b.state] || []).push(b));
    pick.innerHTML += Object.keys(groups).sort().map((st) => '<optgroup label="' + E(st) + '">' + groups[st].slice().sort((a, b) => a.city.localeCompare(b.city))
      .map((b) => '<option value="' + b.id + '">' + E(b.city) + " · " + E(b.name) + " (" + total(b.id) + ")</option>").join("") + "</optgroup>").join("");
    pick.onchange = () => { if (pick.value) { selState = BY[pick.value].state; openBasilica(pick.value, true); } };
  }

  // ---------- side panel ----------
  const side = () => ({ h: document.getElementById("gsH"), t: document.getElementById("gsT"), b: document.getElementById("gsB") });
  function setHash(h) { history.replaceState(null, "", h ? "#" + h : location.pathname); }
  function fromHash() {
    const h = location.hash, b = (h.match(/[#&]b=([a-z0-9-]+)/) || [])[1], s = (h.match(/[#&]s=([^&]+)/) || [])[1], t = (h.match(/[#&]t=(photos|reviews|questions)/) || [])[1];
    if (t) tab = t;
    if (b && BY[b]) { selState = BY[b].state; openBasilica(b, false); }
    else if (s && decodeURIComponent(s) in stateIndex()) openState(decodeURIComponent(s), false);
    else intro();
  }
  function stateIndex() { const o = {}; LIST.forEach((b) => (o[b.state] = (o[b.state] || 0) + 1)); return o; }
  function scrollSide(go) { if (go && innerWidth < 1000) document.getElementById("gside").scrollIntoView({ behavior: "smooth", block: "start" }); }

  function row(b) {
    const c = cnt(b.id);
    return '<li><a href="#b=' + b.id + '" data-b="' + b.id + '"><span class="gl-n"><b>' + E(b.city) + "</b> · " + E(b.name) + (VISITS.has(b.id) ? ' <span class="gl-v" title="You’ve visited">✓</span>' : "") +
      '</span><span class="gl-c' + (AB.countTotal(c) ? "" : " zero") + '">' + countLine(c) + "</span></a></li>";
  }
  function wireRows(el) { el.querySelectorAll("[data-b]").forEach((a) => (a.onclick = (e) => { e.preventDefault(); selState = BY[a.dataset.b].state; openBasilica(a.dataset.b, true); })); }

  function intro() {
    const S = side(); selB = null; markSel();
    S.h.textContent = "Choose a basilica"; S.t.textContent = "";
    const top = LIST.slice().sort((a, b) => total(b.id) - total(a.id)).filter((b) => total(b.id)).slice(0, 8);
    S.b.innerHTML = '<p style="margin-top:0">Tap a state on the map to zoom in, then tap a basilica to see what members have shared: photos you can like, reviews of what they enjoyed, and <b>questions</b> you can ask and answer. Each basilica also has its own page with all three.</p>' +
      '<p class="hint">To zoom the map further, pinch it with two fingers or use the + and &minus; buttons. Only the map zooms; the rest of the page stays the same size.</p>' +
      (top.length ? '<h3 class="gsub">Most shared so far</h3><ul class="glist">' + top.map(row).join("") + "</ul>"
        : '<p class="empty">Nothing has been shared yet. Add photos to your visits in <a href="account.html">My pilgrimage</a> and they’ll appear here once approved.</p>');
    wireRows(S.b);
  }

  function openState(name, go) {
    selState = name; selB = null; markSel(); zoomTo(name); setHash("s=" + encodeURIComponent(name));
    const S = side(), list = LIST.filter((b) => b.state === name).sort((a, b) => a.city.localeCompare(b.city) || a.name.localeCompare(b.name));
    S.h.textContent = name; S.t.textContent = plural(list.length, "basilica");
    S.b.innerHTML = '<ul class="glist">' + list.map(row).join("") + "</ul>";
    wireRows(S.b); scrollSide(go);
  }

  // ---------- one basilica: photos, reviews, questions (members/bview.js) ----------
  function openBasilica(id, go) {
    const b = BY[id]; if (!b) return intro();
    selB = id; markSel();
    if (!document.querySelector('#gmap .gst.on[data-n="' + CSS.escape(b.state) + '"]')) zoomTo(b.state);
    const hash = () => setHash("b=" + id + (tab !== "photos" ? "&t=" + tab : ""));
    hash();
    document.getElementById("gpick").value = id;
    const S = side();
    S.h.textContent = b.name; S.t.textContent = b.city + ", " + b.state;
    S.b.innerHTML = '<p class="gback"><a href="#s=' + encodeURIComponent(b.state) + '" data-st>&larr; ' + E(b.state) + "</a> · " +
      '<a href="basilica.html?b=' + id + '"><b>Full page</b></a> · <a href="index.html#b=' + id + '">On the main map</a>' +
      (VISITS.has(id) ? ' · <a href="account.html#b=' + id + '">Your visit</a>' : "") + '</p><div data-view></div>';
    AB.basilicaView(S.b.querySelector("[data-view]"), b, {
      M, visits: VISITS, counts: cnt(id), tab, sort,
      onState: (st) => { tab = st.tab; sort = st.sort; hash(); },
      onRecheck: (m) => { M = m; note(); openBasilica(id, false); }
    });
    S.b.querySelector("[data-st]").onclick = (e) => { e.preventDefault(); openState(b.state, false); };
    scrollSide(go);
  }
})();
</script>
</body>
</html>
