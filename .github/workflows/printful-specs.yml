name: Printful catalog specs
on: { push: { branches: [shop-assets], paths: [printful/specs.py] } }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests && python printful/specs.py
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add printful; git commit -m "Printful catalog specs" || true; git pull --rebase -q; git push
