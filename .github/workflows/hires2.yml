name: Find and fetch larger basilica photos (shirts)
on: { push: { branches: [shop-assets], paths: [hires2/candidates.py, hires2/fetch.py] } }
permissions: { contents: write }
concurrency: { group: hires2, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - name: Candidates
        if: ${{ !hashFiles('hires2/candidates.json') }}
        run: python hires2/candidates.py
      - name: Fetch chosen originals
        if: ${{ hashFiles('hires2/choices.json') != '' }}
        run: python hires2/fetch.py
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add hires2; git commit -m "Larger basilica photos for shirts" || true; git push
