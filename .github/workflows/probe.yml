name: Photo probe
on: { push: { branches: [photo-probe], paths: [probe.py] } }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests && python probe.py
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add result.json thumbs; git commit -m "probe results"; git push
